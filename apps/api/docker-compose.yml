# Local development.
#   docker compose up -d db                 # just Postgres (run the API with uvicorn locally)
#   docker compose --profile app up -d      # Postgres + API + worker in containers
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cch
    ports: ["5433:5432"]
    volumes:
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cch"]
      interval: 2s
      retries: 30

  api:
    profiles: ["app"]
    build:
      context: .
      additional_contexts:
        schema: ../../database
    environment: &env
      CCH_DATABASE_URL: postgresql+asyncpg://cch_api:cch_api_dev@db:5432/cch
      CCH_WORKER_DATABASE_URL: postgresql+asyncpg://cch_worker:cch_worker_dev@db:5432/cch
      CCH_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cch
      CCH_DEV_IDP: "true"
      CCH_ENABLE_DEMO_RESET: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8001:8001"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: .
      additional_contexts:
        schema: ../../database
    command: ["uv", "run", "--no-sync", "python", "-m", "app.jobs.worker"]
    environment: *env
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
